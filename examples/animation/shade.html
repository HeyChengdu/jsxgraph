<!doctype html>
<html lang="zh-CN">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>shade · 区域填充强调</title>
    <link rel="stylesheet" href="../../distrib/jsxgraph.css" />
    <style>
        body {
            max-width: 960px;
            margin: 32px auto;
            padding: 0 20px;
            font: 18px system-ui;
            color: #243247;
        }
        #board {
            width: 100%;
            height: 540px;
        }
        button {
            margin: 8px;
            padding: 10px 16px;
            font: inherit;
            cursor: pointer;
        }
        pre {
            background: #f3f5f8;
            padding: 16px;
            overflow: auto;
        }
    </style>
    <h1>强调的是内部区域，不是外接矩形</h1>
    <p>点击按钮播放填充；拖动带标签的顶点，再次播放，核对填充是否跟随边界。扇形保留圆弧。</p>
    <div id="board"></div>
    <nav id="controls"></nav>
    <pre>
board.shade([A, B, D], 1800);
polygon.shade(1800);
circle.shade(1800);
ellipse.shade(1800);
sector.shade(1800);</pre>
    <p>
        顶点须按边界顺序排列。填充自动消退，不改变坐标、原有颜色与透明度。开放曲线、自交及退化区域会明确报错。
    </p>
    <script type="module">
        import JXG from "../../src/index.js";
        const board = JXG.JSXGraph.initBoard("board", {
            boundingbox: [-8, 5, 8, -4],
            showCopyright: false,
            showNavigation: false
        });
        const point = (x, y, name = "") =>
            board.create("point", [x, y], {
                name,
                withLabel: Boolean(name),
                visible: Boolean(name),
                fixed: !name,
                strokeColor: "slate-700",
                fillColor: "slate-700",
                size: 2
            });
        const style = {
            withLabel: false,
            strokeColor: "slate-700",
            fillOpacity: 0,
            strokeWidth: 2
        };
        const A = point(-7, 1, "A"),
            B = point(-4, 1, "B"),
            D = point(-6, 4, "D");
        board.create("polygon", [A, B, D], style);
        const polygon = board.create(
            "polygon",
            [point(-2, 1), point(1, 1), point(0, 2), point(1, 4), point(-2, 4)],
            style
        );
        const circle = board.create("circle", [point(5, 2.5), 1.3], style);
        const ellipse = board.create("ellipse", [point(-5, -2), point(-3, -2), 4], style);
        const sector = board.create(
            "sector",
            [point(3, -2.8), point(6, -2.8), point(3, 0)],
            style
        );
        const cases = [
            ["三角形顶点", () => board.shade([A, B, D], 1800)],
            ["凹多边形", () => polygon.shade(1800)],
            ["圆", () => circle.shade(1800)],
            ["椭圆", () => ellipse.shade(1800)],
            ["扇形", () => sector.shade(1800)]
        ];
        for (const [title, run] of cases) {
            const button = document.createElement("button");
            button.textContent = title;
            button.onclick = () => {
                board.animationScheduler.cancelAll();
                run();
            };
            document.getElementById("controls").append(button);
        }
    </script>
</html>
